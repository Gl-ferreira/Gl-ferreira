<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="A DNA helix flowing into a line chart and bar chart">
  <style>
    .flow { stroke: #58A6FF; stroke-width: 2; stroke-dasharray: 2 8; fill: none; opacity: .6; animation: flow 1.2s linear infinite; }
    .axis { stroke: #8b949e; stroke-width: 1.5; opacity: .5; }
    .line { stroke: #58A6FF; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 520; stroke-dashoffset: 0; animation: draw 6s ease-in-out infinite; }
    .dot { fill: #58A6FF; opacity: 1; animation: dot 6s ease-in-out infinite; }
    .bar { fill: #58A6FF; opacity: .3; transform-box: fill-box; transform-origin: bottom; transform: scaleY(1); animation: grow 6s ease-in-out infinite; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .4s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .8s; } .d5 { animation-delay: 1s; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes draw { 0%, 10% { stroke-dashoffset: 520; } 55%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 520; } }
    @keyframes dot  { 0%, 50% { opacity: 0; } 58%, 85% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes grow { 0%, 15% { transform: scaleY(0); } 45%, 85% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
    @media (prefers-reduced-motion: reduce) { .flow, .line, .dot, .bar { animation: none; } }
  </style>

